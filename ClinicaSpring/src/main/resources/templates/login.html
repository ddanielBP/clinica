<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iniciar sesión — Expedientes clínicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#062f44;min-height:100%;
  }
  .panel{
    width:100%;min-height:100dvh;
    background:linear-gradient(90deg,#3d7c9d 0%,#185d7d 38%,#0a3a52 72%,#042433 100%);
    display:grid;place-items:center;padding:80px 20px;
  }
  .form{width:340px;text-align:center}
  .brand{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.9)}
  h1{margin:0 0 36px;font-size:32px;font-weight:700;color:#fff;letter-spacing:.01em}
  .field{position:relative;text-align:left;margin:0 0 28px}
  .field label{display:block;font-size:14px;color:rgba(255,255,255,.9);margin:0 0 6px}
  .field input{
    width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.95);
    background:transparent;outline:none;color:#fff;font:inherit;font-size:16px;padding:4px 32px 9px 0;
  }
  .field input::placeholder{color:rgba(255,255,255,.75)}
  .field input:focus{border-bottom-color:#fff;box-shadow:0 1px 0 #fff}
  .field svg{position:absolute;right:2px;bottom:10px;width:19px;height:19px;stroke:#fff;opacity:.95}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 18px;font-size:12.5px;color:#fff;white-space:nowrap}
  .meta label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .meta input{width:14px;height:14px;margin:0;accent-color:#fff}
  .meta a{color:#fff;text-decoration:none}
  .meta a:hover{text-decoration:underline}
  .go{
    width:100%;border:0;border-radius:999px;background:#fff;color:#1f1f22;
    font:inherit;font-size:16px;font-weight:600;padding:13px 0;cursor:pointer;
  }
  .go:hover{background:#f2f7fa}
  .go:active{transform:translateY(1px)}
  .foot{margin:22px 0 0;font-size:12.5px;line-height:1.7;color:rgba(255,255,255,.95)}
  .foot a{color:#fff;font-weight:700;text-decoration:none}
  .foot a:hover{text-decoration:underline}
  .err{font-size:12px;color:#fff;background:rgba(140,20,20,.45);border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:7px 9px;margin:0 0 14px;text-align:left}
  .ok{font-size:12px;color:#fff;background:rgba(20,122,62,.45);border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:7px 9px;margin:0 0 14px;text-align:left}
  @media (max-width:640px){.form{width:min(340px,86vw)}}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
  <main class="panel" aria-labelledby="titulo">
    <div class="form">
      <p class="brand">Expedientes clínicos</p>
      <h1 id="titulo">Iniciar sesión</h1>
      <div class="err" th:if="${error}" th:text="${error}" role="alert">Correo o contraseña incorrectos.</div>
      <div class="ok" th:if="${param.exito}" role="status">Cuenta creada. Entra con tu correo y contraseña.</div>
      <form th:action="@{/login}" method="post">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" name="correo" th:value="${correo}" placeholder="nombre@clinica.mx" autocomplete="username" required />
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </div>
        <div class="field">
          <label for="pass">Contraseña</label>
          <input id="pass" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required style="padding-right:70px" />
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <button type="button" id="showBtn" aria-pressed="false" style="position:absolute;right:2px;bottom:4px;border:0;background:transparent;color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:6px 8px">Mostrar</button>
        </div>
        <div class="meta">
          <label><input type="checkbox" name="remember-me" /> Recuérdame</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
        <button class="go" type="submit">Entrar</button>
      </form>
      <p class="foot">¿No tienes cuenta?<br /><a th:href="@{/registro}" href="#">Regístrate</a></p>
    </div>
  </main>
<script>
  const pass = document.getElementById('pass');
  const showBtn = document.getElementById('showBtn');
  showBtn.addEventListener('click', () => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    showBtn.textContent = show ? 'Ocultar' : 'Mostrar';
    showBtn.setAttribute('aria-pressed', String(show));
    pass.focus();
  });
</script>
</body>
</html>
