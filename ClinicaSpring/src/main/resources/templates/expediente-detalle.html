<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expediente — Expedientes clínicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(1000px 700px at 6% 18%, rgba(47,111,180,.85) 0%, rgba(47,111,180,0) 60%),radial-gradient(900px 620px at 88% 88%, rgba(240,138,75,.9) 0%, rgba(240,138,75,0) 58%),radial-gradient(760px 520px at 78% 8%, rgba(207,224,239,.9) 0%, rgba(207,224,239,0) 62%),linear-gradient(135deg,#3a78c2 0%,#a9c4de 38%,#e8c9ae 68%,#f08a4b 100%);background-attachment:fixed;color:#1c1c1e;min-height:100%}
  ::selection{background:#07576e;color:#fff}
  .wrap{max-width:760px;margin:0 auto;padding:28px 24px 48px}
  header{display:flex;justify-content:space-between;align-items:center;margin:0 0 22px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-radius:14px;padding:12px 18px;box-shadow:0 2px 10px rgba(20,20,30,.08)}
  .brand{font-size:15px;font-weight:800}.brand span{color:#0d7d9c}
  .out{font-size:12.5px;font-weight:600;color:#5d5d62}
  .out:focus-visible{outline:2px solid #07576e;outline-offset:2px}
  .sheet{background:#fff;border-radius:18px;padding:28px;box-shadow:0 2px 10px rgba(20,20,30,.06)}
  .folio{font-size:12px;font-weight:700;letter-spacing:.08em;color:#0d7d9c;text-transform:uppercase}
  h1{margin:6px 0 2px;font-size:24px;letter-spacing:-.02em}
  .fecha{font-size:13px;color:#5d5d62}
  .sec{margin-top:20px;padding-top:16px;border-top:1px solid #f0f0f2}
  .sec h2{margin:0 0 6px;font-size:13px;font-weight:700;color:#07576e;text-transform:uppercase;letter-spacing:.06em}
  .sec p{margin:0;font-size:14.5px;line-height:1.6;white-space:pre-line}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .tto{border:1px solid #e2e2e5;border-radius:12px;padding:14px 16px;margin-top:10px}
  .tto b{font-size:14.5px}
  .tto p{margin:6px 0 0;font-size:13.5px;color:#3f3f43;line-height:1.55}
  .tto .dias{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;background:#e3f1f4;color:#07576e;border-radius:999px;padding:4px 11px}
  .empty{font-size:13.5px;color:#5d5d62}
  @media (max-width:600px){.grid2{grid-template-columns:1fr}.sheet{padding:22px 18px}}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Expedientes <span>clínicos</span></div>
    <a class="out" th:href="@{/panel}" href="#">← Volver al panel</a>
  </header>

  <article class="sheet">
    <div class="folio" th:text="'Expediente EXP-' + ${expediente.idConsulta}">EXP-1</div>
    <h1 th:text="${expediente.motivoConsulta}">Motivo</h1>
    <div class="fecha" th:text="${#temporals.format(expediente.fechaConsulta, 'dd MMMM yyyy · HH:mm')}">fecha</div>

    <div class="grid2">
      <div class="sec">
        <h2>Paciente</h2>
        <p th:text="${expediente.paciente.nombre + ' ' + expediente.paciente.apellido}">—</p>
      </div>
      <div class="sec">
        <h2>Médico tratante</h2>
        <p th:text="${expediente.medico.nombre + ' ' + expediente.medico.apellido + ' · ' + expediente.medico.especialidad}">—</p>
      </div>
    </div>

    <div class="sec">
      <h2>Diagnóstico</h2>
      <p th:text="${expediente.diagnostco}">—</p>
    </div>
    <div class="sec" th:if="${expediente.signosVitales != null and !expediente.signosVitales.isBlank()}">
      <h2>Signos vitales</h2>
      <p th:text="${expediente.signosVitales}">—</p>
    </div>
    <div class="sec" th:if="${expediente.notasMedicas != null and !expediente.notasMedicas.isBlank()}">
      <h2>Notas médicas</h2>
      <p th:text="${expediente.notasMedicas}">—</p>
    </div>

    <div class="sec">
      <h2>Tratamiento</h2>
      <div class="tto" th:each="t : ${tratamientos}">
        <b th:text="${t.medicamentoOProcedimiento}">Medicamento</b>
        <p th:text="${t.dosisInstrucciones}">Dosis</p>
        <p th:if="${t.indicacionesAdicionales != null and !t.indicacionesAdicionales.isBlank()}" th:text="${t.indicacionesAdicionales}">Indicaciones</p>
        <span class="dias" th:if="${t.duracionDias != null}" th:text="${t.duracionDias} + ' días'">7 días</span>
      </div>
      <p class="empty" th:if="${#lists.isEmpty(tratamientos)}">Sin tratamiento registrado.</p>
    </div>
  </article>
</div>
</body>
</html>
